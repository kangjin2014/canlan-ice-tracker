services:
  - type: web
    name: canlan-ice-tracker
    runtime: node
    plan: starter
    healthCheckPath: /
    buildCommand: "npm install && npx playwright install --with-deps chromium"
    startCommand: "npm start"
    envVars:
      - key: CATCHCORNER_URL
        value: https://www.catchcorner.com/facility-page/embedded/rental/canlan-sports-oakville
      - key: PRICE_THRESHOLD
        value: "150"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"    # installs Chromium inside node_modules so it survives into the runtime container
      - key: EARLIEST_HOUR
        value: "7"
      - key: LATEST_HOUR
        value: "19"
      - key: EMAIL_TO
        sync: false            # set in Render dashboard
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CHECK_SECRET
        sync: false            # pick any random string; required as ?key= to trigger /check
      - key: REDIS_URL
        fromService:
          name: canlan-ice-tracker-kv
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: canlan-ice-tracker-kv
    plan: free
    ipAllowList: []
