services:
  - type: web
    name: canlan-ice-tracker
    env: python
    buildCommand: "pip install -r requirements.txt && playwright install chromium"
    startCommand: "gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
