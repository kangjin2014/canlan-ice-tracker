services:
  - type: cron
    name: canlan-ice-tracker
    runtime: node
    plan: starter
    schedule: "*/15 * * * *"   # every 15 min; tighten/loosen as you like
    buildCommand: "npm install && npx playwright install --with-deps chromium"
    startCommand: "npm start"
    envVars:
      - key: CATCHCORNER_URL
        value: https://www.catchcorner.com/facility-page/embedded/rental/canlan-sports-oakville
      - key: PRICE_THRESHOLD
        value: "150"          # alert when a slot's total price is <= this
      - key: EMAIL_TO
        sync: false            # set in Render dashboard
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: canlan-ice-tracker-kv
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: canlan-ice-tracker-kv
    plan: free
    ipAllowList: []
